worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error context can contain document URLs. API status/duration logs and
# container health provide the metadata channel; do not collect request URLs.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # URLs can contain case/document identifiers. Do not enable URL access logs.
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 10m;
  send_timeout 90s;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    location = /healthz { return 200 "OK\n"; }
    location /api/ {
      proxy_pass http://api:5001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Overwrite, rather than append attacker-supplied forwarding headers.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 90s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
