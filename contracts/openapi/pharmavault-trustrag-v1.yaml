openapi: 3.1.0
info:
  title: PharmaVault TrustRAG API
  version: 1.0.0
  description: >
    The core API contract for the TrustRAG Verification Engine.
    Endpoints require native-client JWT Bearer authentication or a protected
    browser session cookie. Browser mutations additionally require an exact
    allowed Origin and X-PharmaVault-Client header with value web. Browser
    sessions last 15 minutes; native tokens last at most one hour. Logout at
    POST /api/users/logout revokes all earlier sessions for that account.
    Tenant isolation is enforced on all endpoints where applicable.

servers:
  - url: /api/v1
    description: Primary API routing namespace

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-pv_session
      description: Production HTTPS-only HttpOnly SameSite=Strict host cookie; development uses pv_session. No browser token is returned in JSON.

  schemas:
    DataRequest:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [ EXPORT, ERASURE ] }
        status: { type: string, enum: [ OPEN, COMPLETED, BLOCKED, CANCELLED ] }
        reason: { type: [ string, 'null' ] }
        dueBy: { type: [ string, 'null' ], format: date-time }
        createdAt: { type: string, format: date-time }
        processedAt: { type: [ string, 'null' ], format: date-time }
      required: [ id, type, status, createdAt ]
    AuditChainVerification:
      type: object
      properties:
        ok: { type: boolean }
        checked: { type: integer, minimum: 0 }
        fromSeq: { type: integer }
        headSeq: { type: integer, minimum: 0 }
        headHash: { type: [ string, 'null' ] }
        legacyUnchained: { type: integer, minimum: 0, description: Events written before the chain existed (not covered) }
        problem: { type: string, enum: [ MISSING_EVENT, PREV_HASH_MISMATCH, HASH_MISMATCH, HEAD_MISMATCH, AUDIT_CHAIN_KEY_MISSING, VERIFY_ERROR ] }
        seq: { type: integer }
        detail: { type: string }
      required: [ ok, checked, headSeq, legacyUnchained ]
    RecoveryCodes:
      type: array
      description: One-time MFA recovery codes, shown once. Stored server-side only as SHA-256 hashes.
      minItems: 8
      maxItems: 8
      items: { type: string, pattern: '^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$' }
    ChatProviderReadiness:
      $ref: '../schemas/chat-provider-readiness.schema.json'
    VerificationCase:
      $ref: '../schemas/verification-case.schema.json'
    Document:
      $ref: '../schemas/document.schema.json'
    Error:
      $ref: '../schemas/error.schema.json'
    ReviewDecision:
      $ref: '../schemas/review-decision.schema.json'
    MedicineItemBundle:
      $ref: '../schemas/medicine-item.schema.json'
    MedicineReconciliationResult:
      $ref: '../schemas/medicine-reconciliation.schema.json'
    CaseAssistantAnswer:
      $ref: '../schemas/case-assistant-answer.schema.json'
    CaseAssistantFreshness:
      $ref: '../schemas/case-assistant-freshness.schema.json'
    Claim:
      $ref: '../schemas/claim.schema.json'
    CaseShareGrant:
      $ref: '../schemas/case-share-grant.schema.json'
    Notification:
      $ref: '../schemas/notification.schema.json'
    ReviewAssignment:
      type: object
      properties:
        caseId: { type: string }
        status: { type: string }
        assignment:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                assignedTo: { type: string }
                assignedToMe: { type: boolean }
                assigneeName: { type: [ string, 'null' ] }
                assignedAt: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
              required: [ assignedTo, assignedToMe, assignedAt, expiresAt ]
      required: [ caseId, status, assignment ]
    ClaimsError:
      type: object
      properties:
        code:
          type: string
          description: Stable machine code, e.g. CONSENT_REQUIRED, CASE_NOT_VERIFIED, CLAIM_EXCEEDS_INVOICE, DUPLICATE_OPEN_CLAIM, CASE_HAS_OPEN_CLAIM, ALREADY_DECIDED_BY_PAYER, CASE_FULLY_CLAIMED, APPEAL_WINDOW_CLOSED, APPEAL_WINDOW_OPEN, DECISION_ACCEPTED, INVALID_CLAIM_TRANSITION, CLAIM_CHANGED, CONSENT_INACTIVE
        message:
          type: string
      required: [ code, message ]
    PayerClaimSummary:
      type: object
      properties:
        id: { type: string }
        claimReference: { type: string }
        caseReference: { type: string }
        status: { type: string }
        claimedAmount: { type: number }
        currency: { const: INR }
        openQueries: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        ageHours: { type: integer, minimum: 0 }
      required: [ id, claimReference, status, claimedAmount, currency, openQueries, createdAt, ageHours ]
  parameters:
    StaffUserId:
      name: userId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{24}$' }
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string, enum: [ oldest, newest ], default: oldest }
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
  headers:
    XTotalCount:
      description: Total matching items across all pages
      schema: { type: integer, minimum: 0 }
    XPage:
      description: Page returned (1-based)
      schema: { type: integer, minimum: 1 }
    XLimit:
      description: Page size used
      schema: { type: integer, minimum: 1, maximum: 100 }
  responses:
    ClaimsError:
      description: Claims error (400 validation, 403 role or consent, 404 not found or other tenant, 409 invalid transition or concurrent change)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaimsError'

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /chat/status:
    get:
      summary: Read public chat configuration and recent provider observation
      operationId: getChatCapabilities
      description: >
        Protected metadata read with no upstream model request. Enabled flags
        describe configuration, not live availability. A recent observation
        concerns public generation format/citation checks only and expires after
        five minutes. Private case evidence remains local. No credential values,
        queries, replies, private case identifiers or upstream errors are exposed.
      responses:
        '200':
          description: Current configuration and bounded in-memory public observation
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [generationEnabled, embeddingEnabled, model, publicPassages, healthReferencePassages, privateCasePolicy, providerReadiness]
                properties:
                  generationEnabled:
                    type: boolean
                    description: Configuration eligibility only, not proven provider availability.
                  embeddingEnabled:
                    type: boolean
                    description: Configuration only; actual retrieval method is reported per answer.
                  model:
                    type: [string, 'null']
                  publicPassages:
                    type: integer
                    minimum: 0
                  healthReferencePassages:
                    type: integer
                    minimum: 0
                  privateCasePolicy:
                    const: LOCAL_ONLY
                  providerReadiness:
                    $ref: '#/components/schemas/ChatProviderReadiness'
                  contextualChat:
                    type: object
                    additionalProperties: false
                    required: [version, webEnabled, webProvider, privateWebPolicy, feedbackPolicy]
                    properties:
                      version:
                        const: contextual-chat-v1
                      webEnabled:
                        type: boolean
                      webProvider:
                        const: MEDLINEPLUS_HEALTH_TOPICS
                      privateWebPolicy:
                        const: NEVER
                      feedbackPolicy:
                        const: EXPERT_REVIEW_REQUIRED_NO_AUTOTRAINING
                      precision:
                        type: object
                        additionalProperties: false
                        required: [version, referenceCount, corpusHash, trainedReranker, trainingScope, clinicalValidation, webSynthesisAllowed]
                        properties:
                          version:
                            const: precision-chat-v1
                          referenceCount:
                            type: integer
                            minimum: 0
                          corpusHash:
                            type: string
                            pattern: '^[a-f0-9]{64}$'
                          trainedReranker:
                            type: boolean
                          trainingScope:
                            const: LOCAL_RETRIEVAL_RANKER_NOT_LLM
                          clinicalValidation:
                            const: NOT_PERFORMED
                          webSynthesisAllowed:
                            type: boolean
        '401':
          description: Missing or invalid authentication
        '403':
          description: Invalid staff tenant context

  /chat:
    post:
      summary: Retrieve evidence-backed chatbot answers
      operationId: answerEvidenceChat
      description: >
        Conversational retrieval from project guides, a versioned academic
        identity catalogue and a small source-linked educational reference set.
        Public context can use BM25 plus Gemini embeddings and streamed grounded
        generation when explicitly enabled. Optional caseId uses owner/tenant
        current case records and always stays local. Raw questions and history
        are not exported. Scores are retrieval rankings, not clinical confidence.
        This is not live web search or medical/insurance decision automation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
                caseId:
                  type: string
                  pattern: '^[a-fA-F0-9]{24}$'
                history:
                  type: array
                  maxItems: 10
                  description: Used locally to resolve follow-up topics; never trusted as evidence or exported verbatim.
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      text:
                        type: string
                        maxLength: 2000
      responses:
        '200':
          description: Cited source quotations, an honest abstention, or a safety response.
          content:
            application/json:
              schema:
                type: object
                required: [reply, mode, retrieval, sources, warnings, disclaimer]
                properties:
                  reply:
                    type: string
                  mode:
                    type: string
                    enum: [LOCAL_EXTRACTIVE, LOCAL_CASE_EVIDENCE, GEMINI_GROUNDED_QUOTES, GEMINI_RAG, CONVERSATIONAL_HELP, CLARIFY, ABSTAIN, SAFETY, OFFICIAL_WEB_EXTRACTIVE, PRECISE_LOCAL_EVIDENCE, PRECISE_WEB_EVIDENCE]
                  retrieval:
                    type: object
                    required: [method, matchedPassages]
                    properties:
                      method:
                        type: string
                        enum: [BM25, HYBRID_BM25_VECTOR, APPROVED_WEB_BM25, CONTEXT_RERANKED_BM25, CASE_ITEM_EVIDENCE]
                      matchedPassages:
                        type: integer
                        minimum: 0
                  sources:
                    type: array
                    maxItems: 4
                    items:
                      type: object
                      required: [citation, sourceId, title, excerpt, kind, version, score]
                      properties:
                        citation:
                          type: string
                        sourceId:
                          type: string
                        title:
                          type: string
                        excerpt:
                          type: string
                        kind:
                          type: string
                          enum: [PROJECT_GUIDE, ACADEMIC_CATALOGUE, CASE_RECORD, HEALTH_REFERENCE, OFFICIAL_WEB]
                        version:
                          type: string
                        score:
                          type: number
                          description: Retrieval ranking score (BM25 or reciprocal-rank fusion), not confidence or clinical accuracy.
                        sourceUrl:
                          type: string
                          format: uri
                        href:
                          type: string
                          pattern: '^/cases/[a-fA-F0-9]{24}$'
                        documentId:
                          type: string
                        pageNumber:
                          type: integer
                          minimum: 1
                  warnings:
                    type: array
                    items:
                      type: string
                  disclaimer:
                    type: string
                  model:
                    type: string
                  followupResolved:
                    type: boolean
                  feedbackReceipt:
                    type: string
                    format: uuid
                    description: Opaque, owner-bound public-answer feedback receipt, expiring after one hour. Not a training approval.
                  context:
                    type: object
                    description: Bounded topic, focus, style and intent projection; history is not factual evidence. knowledgeRevision identifies the organization retrieval policy, not medical approval.
                    properties:
                      topicSwitchResolved:
                        type: boolean
                      request:
                        type: object
                        additionalProperties: false
                        required: [attribute, language, evidenceStatus, method]
                        description: Fixed request metadata only. Local query anchors and raw history are never included. Text matching is not clinical or semantic validation.
                        properties:
                          attribute:
                            enum: [GENERAL, USES, SIDE_EFFECTS, STORAGE, PREVENTION, MECHANISM, SPECIFIC_FACT]
                          language:
                            type: string
                          evidenceStatus:
                            enum: [NOT_ASSESSED, MISSING, MATCHED_TEXT]
                          method:
                            const: CONSERVATIVE_TEXT_MATCH_NOT_SEMANTIC_PROOF
                  answerQuality:
                    type: object
                    description: Output diagnostics only, not clinical accuracy, gold-standard agreement or model superiority.
                    required: [focus, style, words, sourceCount, trainedReranker, assessment]
                    properties:
                      focus:
                        type: string
                      style:
                        enum: [STANDARD, CONCISE]
                      words:
                        type: integer
                        minimum: 0
                      sourceCount:
                        type: integer
                        minimum: 0
                      trainedReranker:
                        type: boolean
                      modelVersion:
                        type: [string, 'null']
                      assessment:
                        enum: [EXTRACTIVE_SOURCE_SUPPORT_NOT_CLINICAL_ACCURACY, MECHANICAL_CITATION_CHECKS_NOT_SEMANTIC_OR_CLINICAL_PROOF]
                      requestMatch:
                        const: CONSERVATIVE_TEXT_MATCH_NOT_SEMANTIC_PROOF
                  agentTrace:
                    type: array
                    maxItems: 5
                    description: Tool/action outcomes, never hidden model reasoning.
                    items:
                      type: object
                      required: [tool, status]
                      properties:
                        tool:
                          type: string
                        status:
                          type: string
                  routing:
                    type: object
                    required: [intent, reasonCode, policyVersion]
                    properties:
                      intent:
                        type: string
                      reasonCode:
                        type: string
                      policyVersion:
                        type: string
        '400':
          description: Invalid or unsupported input.
        '401':
          description: Authentication required.
        '403':
          description: Private retrieval role denied or tenant context missing.
        '404':
          description: Case absent or inaccessible, without cross-tenant enumeration.
        '429':
          description: Chat rate limit exceeded.
  /chat/stream:
    post:
      summary: Stream a conversational evidence-grounded answer
      operationId: streamEvidenceChat
      description: >
        Authenticated POST SSE. Events are status, meta, delta, reset, done and
        error. Deltas contain complete model paragraphs only after checking their
        reference IDs and supporting source quotations. Such checking establishes
        traceability, not semantic or clinical correctness. A reset replaces any
        incomplete generated text with explicit local fallback. Client disconnect
        cancels model work. Private-case access is checked before SSE opens.
      requestBody:
        $ref: '#/paths/~1chat/post/requestBody'
      responses:
        '200':
          description: Source metadata, validated answer paragraphs and the final response.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request.
        '401':
          description: Authentication required.
        '403':
          description: Private case role or tenant context denied.
        '404':
          description: Case absent or inaccessible.
        '429':
          description: Chat rate limit exceeded.
  /chat/feedback:
    post:
      summary: Rate an owned public answer for later expert review
      operationId: submitChatFeedback
      description: Stores bounded metadata only with 30-day retention. No raw chat or correction text is accepted. Feedback never updates knowledge or trains a model automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receipt, rating]
              properties:
                receipt:
                  type: string
                  format: uuid
                rating:
                  enum: [HELPFUL, NOT_HELPFUL]
      responses:
        '200':
          description: Queued for expert review; no learning applied.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, status, learningApplied]
                properties:
                  accepted:
                    const: true
                  status:
                    const: PENDING_EXPERT_REVIEW
                  learningApplied:
                    const: false
        '400':
          description: Invalid or unsupported feedback fields.
        '401':
          description: Authentication required.
        '404':
          description: Receipt unavailable, expired or owned by another user.
        '429':
          description: Rate limit exceeded.
  /chat/knowledge/references:
    get:
      operationId: listCurationReferences
      summary: List fixed public references eligible for source-ranking review
      description: Organization reviewers only. No private documents, raw chats, replacement medical facts or automatic training.
      responses:
        '200':
          description: Versioned reference choices, topics, focuses and corpus hash.
        '401':
          description: Authentication required.
        '403':
          description: Authorized reviewer with explicit organization membership required.
  /chat/knowledge/feedback:
    get:
      operationId: listOrganizationChatFeedback
      summary: List up to 30 recent negative feedback metadata records in own organization
      responses:
        '200':
          description: Ratings and source/version identifiers only; no raw messages or patient text.
        '401':
          description: Authentication required.
        '403':
          description: Organization reviewer required.
  /chat/knowledge/candidates:
    get:
      operationId: listCurationCandidates
      summary: List up to 30 recent proposals in own organization
      responses:
        '200':
          description: Proposals and review journal. Pending proposals have no effect on retrieval.
        '401':
          description: Authentication required.
        '403':
          description: Organization reviewer required.
    post:
      operationId: proposeSourcePreference
      summary: Propose a topic- and focus-compatible source preference
      description: Source IDs must already exist in the current fixed registry. Free medical text and patient content are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topicId, focus, sourceIds, corpusHash]
              properties:
                topicId:
                  type: string
                focus:
                  enum: [DEFINITION, OVERVIEW, SIDE_EFFECTS, PREVENTION, IDENTITY, EXPLAIN]
                sourceIds:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items:
                    type: string
                corpusHash:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
      responses:
        '201':
          description: Pending organization-bound proposal. No model weights changed.
        '400':
          description: Invalid fields, stale corpus or incompatible source scope.
        '401':
          description: Authentication required.
        '403':
          description: Organization reviewer required.
        '429':
          description: Rate limit exceeded.
  /chat/knowledge/candidates/{id}/review:
    post:
      operationId: reviewSourcePreference
      summary: Independently approve, reject or revoke a source preference
      description: A reviewer other than the creator is required. Atomic revisions prevent concurrent overwrites. Approval changes organization retrieval ranking only; revocation of the latest policy restores defaults. Neither operation changes model weights or historical answers.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, revision, reasonCode]
              properties:
                decision:
                  enum: [APPROVE, REJECT, REVOKE]
                revision:
                  type: integer
                  minimum: 1
                reasonCode:
                  enum: [SOURCE_FOCUS_SUPPORTED, NOT_RELEVANT, NEEDS_SOURCE_REVIEW, REVERT_TO_DEFAULT]
      responses:
        '200':
          description: Updated proposal, journal and explicit modelWeightsChanged false.
        '400':
          description: Invalid or mismatched decision/reason.
        '401':
          description: Authentication required.
        '403':
          description: Self-review or unauthorized role denied.
        '404':
          description: Proposal absent or inaccessible.
        '409':
          description: Corpus changed or stale/concurrent review. Refresh before retrying.
        '429':
          description: Rate limit exceeded.
  /cases:
    post:
      summary: Create a new Verification Case
      description: Initiates a new TrustRAG workflow for document verification.
      operationId: createCase
      security:
        - bearerAuth: [ "patient", "pharmacist", "org_admin" ]
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectReference:
                  type: string
                  description: Pseudonymous reference to the patient
              additionalProperties: false
            example:
              subjectReference: "patient-12345"
      responses:
        '201':
          description: Case created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCase'
              example:
                id: "64a0f4b39b3a4a001c900d5a"
                organizationId: "64a0f4b39b3a4a001c900d5b"
                createdBy: "64a0f4b39b3a4a001c900d5c"
                status: "DRAFT"
                schemaVersion: "1.0"
                createdAt: "2026-08-03T12:00:00Z"
                updatedAt: "2026-08-03T12:00:00Z"
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests

    get:
      summary: List Verification Cases
      description: Returns a paginated list of cases scoped to the user's tenant.
      operationId: listCases
      security:
        - bearerAuth: [ "patient", "pharmacist", "claims_reviewer", "org_admin", "super_admin", "research_evaluator" ]
        - cookieAuth: []
      responses:
        '200':
          description: A list of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerificationCase'

  /cases/{caseId}:
    get:
      summary: Get a Case by ID
      operationId: getCase
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCase'
        '404':
          description: Case not found or access denied (tenant isolation)
    patch:
      summary: Update Case metadata or close case
      description: Staff-only endpoint to close a verified/rejected case or update metadata. Cannot set final states directly.
      operationId: updateCase
      security:
        - bearerAuth: [ "pharmacist", "claims_reviewer", "org_admin" ]
        - cookieAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ "CLOSED" ]
                metadata:
                  type: object
      responses:
        '200':
          description: Case updated
        '400':
          description: Validation Error (invalid status transition or injected internal metadata)
        '403':
          description: Forbidden (patient, super_admin, or unauthorized role)
        '404':
          description: Case not found

  /cases/{caseId}/documents:
    post:
      summary: Upload a document to a case
      operationId: uploadDocument
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [ "PRESCRIPTION", "PHARMACY_INVOICE", "CLAIM_FORM" ]
              required: [ "file", "type" ]
      responses:
        '201':
          description: Document uploaded and scheduled for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid file format
        '404':
          description: Case not found
    get:
      summary: List documents for a case
      operationId: listDocuments
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of documents

  /cases/{caseId}/documents/{documentId}:
    get:
      summary: Get document metadata
      operationId: getDocument
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document metadata
    delete:
      summary: Remove a document from a case
      operationId: deleteDocument
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Document deleted
        '409':
          description: Conflict (Document already processed)

  /cases/{caseId}/documents/{documentId}/content:
    get:
      summary: Retrieve raw document content stream
      description: Returns the validated raw binary document bytes for visual evidence review. Never exposes internal storage paths or keys.
      operationId: getDocumentContent
      security:
        - bearerAuth: [ "patient", "pharmacist", "claims_reviewer", "org_admin", "super_admin" ]
        - cookieAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Raw document content stream
          headers:
            Content-Type:
              schema:
                type: string
              description: MIME type of the document (image/png, image/jpeg, image/webp, application/pdf)
            Content-Disposition:
              schema:
                type: string
              description: inline
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
        '404':
          description: Case or document not found, or cross-tenant access denied
        '429':
          description: Too many requests for document content

  /cases/{caseId}/documents/{documentId}/pages/{pageNumber}/preview:
    get:
      summary: Retrieve rendered PDF page preview
      description: Returns the locally rendered PNG page preview bytes for visual evidence review. Never exposes internal storage keys or local filesystem paths.
      operationId: getDocumentPagePreview
      security:
        - bearerAuth: [ "patient", "pharmacist", "claims_reviewer", "org_admin", "super_admin" ]
        - cookieAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 3
      responses:
        '200':
          description: Locally rendered PNG page preview
          headers:
            Content-Type:
              schema:
                type: string
              description: image/png
            Content-Disposition:
              schema:
                type: string
              description: inline
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
        '404':
          description: Case, document, or page not found, or cross-tenant access denied
        '429':
          description: Too many requests for document preview

  /cases/{caseId}/process:
    post:
      summary: Trigger TrustRAG processing pipeline
      operationId: processCase
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Processing initiated
        '409':
          description: Conflict (Not all documents uploaded, or already processing)

  /cases/{caseId}/processing-status:
    get:
      summary: Check processing status
      operationId: getProcessingStatus
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current processing stage

  /cases/{caseId}/results:
    get:
      summary: Get AI Results
      operationId: getResults
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Structured verification results

  /cases/{caseId}/assistant/answers:
    post:
      summary: Read medicine-bound local case evidence
      operationId: answerCurrentCaseEvidence
      description: >
        Session 4 contract. Private local deterministic answers cite exact current fields.
        A signed user/case-bound receipt records content dependencies, not medical
        confidence. Does not mutate a case or approve treatment or insurance.
        Implementation acceptance is tracked separately from contract validation.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                medicineItemId:
                  anyOf:
                    - { type: string, pattern: '^mi_[a-f0-9]{24}$' }
                    - { type: 'null' }
      responses:
        '200':
          description: Cited local answer, clarification, abstention or safety boundary; private no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseAssistantAnswer' }
        '400': { description: Invalid or unsupported request fields }
        '401': { description: Authentication required }
        '403': { description: Role or tenant context is not permitted }
        '404': { description: Case unavailable or cross-tenant access denied }
        '409': { description: CASE_BUSY during concurrent evidence mutation }
        '429': { description: Request rate limit exceeded }
  /cases/{caseId}/assistant/prioritized-answers:
    post:
      summary: Read local case evidence with attribute-first citation priority
      operationId: answerCurrentCaseEvidenceWithPriority
      description: >
        Session 6 compatible extension over the frozen local answer service.
        Reorders already-authorized citations by requested field and interleaves
        documents within each field. Preserves every source, factual conclusion,
        warning and signed content-dependency receipt. Does not expand retrieval,
        guarantee evidence sufficiency or approve clinical/insurance decisions.
        Legacy answers and freshness endpoints remain available unchanged.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                medicineItemId:
                  anyOf:
                    - { type: string, pattern: '^mi_[a-f0-9]{24}$' }
                    - { type: 'null' }
      responses:
        '200':
          description: Existing answer wire shape with content-preserving citation priority; private no-store.
          headers:
            X-PharmaVault-Citation-Policy:
              description: Server-side citation-ordering policy version, not a confidence score.
              schema: { type: string, const: 'attribute-balanced/1.0.0' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseAssistantAnswer' }
        '400': { description: Invalid or unsupported request fields }
        '401': { description: Authentication required }
        '403': { description: Role or tenant context is not permitted }
        '404': { description: Case unavailable or cross-tenant access denied }
        '409': { description: CASE_BUSY during concurrent evidence mutation }
        '429': { description: Request rate limit exceeded }
        '500': { description: Controlled internal failure without source content or server details }
  /cases/{caseId}/assistant/freshness:
    post:
      summary: Check signed answer dependencies against current authorized evidence
      operationId: checkCaseAnswerFreshness
      description: >
        Accepts 1-20 distinct answer IDs and bounded signed receipts.
        Every request reauthorizes the case. Unchanged cited dependencies may be
        FRESH despite an unrelated edit. Changed/missing dependencies are STALE;
        invalid, expired or processing evidence is UNVERIFIABLE. Never loads a
        foreign case from a supplied token, rewrites an old answer or alters a human decision.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receipts]
              properties:
                receipts:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [answerId, bindingToken]
                    properties:
                      answerId: { type: string, format: uuid }
                      bindingToken: { type: string, minLength: 1, maxLength: 32768 }
      responses:
        '200':
          description: Exact receipt results with server check time; private no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseAssistantFreshness' }
        '400': { description: Invalid request or duplicate answer IDs }
        '401': { description: Authentication required }
        '403': { description: Role or tenant context is not permitted }
        '404': { description: Case unavailable or cross-tenant access denied }
        '409': { description: CASE_BUSY during concurrent evidence mutation }
        '429': { description: Request rate limit exceeded }

  /cases/{caseId}/reconciliation:
    get:
      summary: Get Current Protected Case Reconciliation Snapshot
      description: >
        Read-only endpoint that builds the live current-evidence Session 1 medicine
        bundles, Session 2 reconciliation result, grouping status, role permissions,
        review eligibility, and deterministic snapshotToken without writing to the database.
      operationId: getCaseReconciliation
      security:
        - bearerAuth: [ "patient", "pharmacist", "pharmacy", "claims_reviewer", "org_admin", "super_admin", "admin" ]
        - cookieAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Live protected case reconciliation snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                  - schemaVersion
                  - caseId
                  - caseStatus
                  - snapshotToken
                  - evidenceRevision
                  - prescription
                  - invoice
                  - comparison
                  - groupingDocuments
                  - permissions
                  - reviewEligibility
                  - notices
                  - legacyFindingsCurrent
                additionalProperties: false
                properties:
                  schemaVersion:
                    type: string
                    const: '2.0.0-session3'
                  caseId:
                    type: string
                  caseStatus:
                    type: string
                  snapshotToken:
                    type: string
                    pattern: '^rs_[a-f0-9]{64}$'
                  evidenceRevision:
                    type: integer
                    minimum: 0
                  legacyFindingsCurrent:
                    type: boolean
                    const: false
                  permissions:
                    type: object
                    additionalProperties: false
                    required: [ canCorrectFields, canConfirmGroups, canReview ]
                    properties:
                      canCorrectFields:
                        type: boolean
                      canConfirmGroups:
                        type: boolean
                      canReview:
                        type: boolean
                  prescription:
                    oneOf:
                      - $ref: '#/components/schemas/MedicineItemBundle'
                      - type: 'null'
                  invoice:
                    oneOf:
                      - $ref: '#/components/schemas/MedicineItemBundle'
                      - type: 'null'
                  comparison:
                    oneOf:
                      - $ref: '#/components/schemas/MedicineReconciliationResult'
                      - type: 'null'
                  groupingDocuments:
                    type: array
                    items:
                      type: object
                  reviewEligibility:
                    type: object
                    additionalProperties: false
                    required: [ canVerify, blockerCodes, allowedActions ]
                    properties:
                      canVerify:
                        type: boolean
                      allowedActions:
                        type: array
                        items:
                          type: string
                          enum: [ VERIFY, RETURN_FOR_CORRECTION, ESCALATE ]
                      blockerCodes:
                        type: array
                        items:
                          type: string
                  notices:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ code, documentId, message ]
                      properties:
                        code:
                          type: string
                        documentId:
                          type: [ string, 'null' ]
                        message:
                          type: string
        '401':
          description: Authentication required
        '403':
          description: Forbidden role or missing tenant context
        '404':
          description: Case not found or cross-tenant access denied

  /cases/{caseId}/documents/{documentId}/medicine-groups:
    put:
      summary: Confirm Staff Medicine Item Grouping for a Document
      description: >
        Staff-only endpoint to confirm how extracted medicine fields are grouped
        into up to 3 medicine rows on a PRESCRIPTION or PHARMACY_INVOICE document.
      operationId: confirmMedicineGroups
      security:
        - bearerAuth: [ "pharmacist", "pharmacy", "claims_reviewer", "org_admin" ]
        - cookieAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - snapshotToken
                - observedItemCount
                - completenessAttested
                - groups
              properties:
                snapshotToken:
                  type: string
                  pattern: '^rs_[a-f0-9]{64}$'
                observedItemCount:
                  type: integer
                  minimum: 1
                  maximum: 3
                completenessAttested:
                  type: boolean
                  const: true
                groups:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - anchorFieldId
                      - fieldIds
                    properties:
                      anchorFieldId:
                        type: string
                      fieldIds:
                        type: array
                        minItems: 1
                        maxItems: 8
                        items:
                          type: string
      responses:
        '200':
          description: Medicine groups confirmed and updated reconciliation snapshot returned
        '400':
          description: Invalid grouping payload or field validation error
        '403':
          description: Forbidden (patient, super_admin, or unauthorized role)
        '404':
          description: Case or document not found
        '409':
          description: Conflict (Stale snapshot token, case finalised/processing, or concurrent mutation)

  /cases/{caseId}/evidence:
    get:
      summary: Get lineage and evidence
      operationId: getEvidence
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of evidence items

  /cases/{caseId}/audit-trail:
    get:
      summary: Get readable audit trail for a case
      operationId: getAuditTrail
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chronological list of audit events for the case

  /cases/{caseId}/extracted-fields/{fieldId}:
    patch:
      summary: Correct an extracted field (Human in the loop)
      operationId: correctField
      security:
        - bearerAuth: [ "pharmacist", "claims_reviewer", "org_admin" ]
        - cookieAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                normalizedValue:
                  type: string
                  minLength: 1
                  maxLength: 500
                snapshotToken:
                  type: string
                  pattern: '^rs_[a-f0-9]{64}$'
              required: ["normalizedValue", "snapshotToken"]
      responses:
        '200':
          description: Field corrected
        '400':
          description: Validation error or invalid snapshotToken
        '403':
          description: Forbidden (patient, super_admin, or unauthorized role)
        '404':
          description: Extracted field not found
        '409':
          description: Conflict (Stale snapshot token, case finalised/processing, or concurrent mutation)

  /review-queue:
    get:
      summary: List cases requiring review (tenant-scoped, paged, oldest first by default)
      operationId: getReviewQueue
      security:
        - bearerAuth: [ "claims_reviewer", "pharmacist", "org_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ NEEDS_REVIEW, NEEDS_CORRECTION ] }
        - name: assigned
          in: query
          required: false
          description: me = cases I hold; unassigned = nobody holds an active lease; others = held by another reviewer
          schema: { type: string, enum: [ me, unassigned, others ] }
        - name: q
          in: query
          required: false
          description: Case or subject reference prefix
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: One page of cases waiting for human review (array; totals in headers)
          headers:
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
            X-Page: { $ref: '#/components/headers/XPage' }
            X-Limit: { $ref: '#/components/headers/XLimit' }

  /cases/{caseId}/reviews:
    get:
      summary: List reviews for a case
      operationId: listReviews
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of decisions made on this case
    post:
      summary: Submit a human review decision
      operationId: submitReview
      security:
        - bearerAuth: [ "pharmacist", "pharmacy", "claims_reviewer", "org_admin", "super_admin", "admin" ]
        - cookieAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum: [ "VERIFY", "RETURN_FOR_CORRECTION", "ESCALATE" ]
                decision:
                  type: string
                  enum: [ "APPROVE", "REQUEST_CLARIFICATION", "ESCALATE" ]
                snapshotToken:
                  type: string
                  pattern: '^rs_[a-f0-9]{64}$'
                reasonCode:
                  type: string
                  minLength: 1
                  maxLength: 80
                notes:
                  type: string
                  minLength: 10
                  maxLength: 2000
                evidenceItemIds:
                  type: array
                  items:
                    type: string
                selfVerifyConfirmed:
                  type: boolean
                  description: Only when the organization allows single-pharmacist verification and the reviewer uploaded or created the case (403 FOUR_EYES_CONFIRMATION_REQUIRED otherwise). Audited as FOUR_EYES_SELF_VERIFY_CONFIRMED.
              required: [ "snapshotToken", "reasonCode", "notes" ]
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecision'
        '400':
          description: Validation error (missing/invalid snapshotToken, short notes, or unsupported decision)
        '403':
          description: Forbidden role, or four-eyes rule (FOUR_EYES_CASE_CREATOR / FOUR_EYES_DOCUMENT_UPLOADER) on VERIFY
        '404':
          description: Case not found or cross-tenant access denied
        '409':
          description: Conflict (stale snapshot token, unresolved blockers, case busy, or CASE_ASSIGNED_TO_OTHER)

  /cases/{caseId}/fhir-bundle:
    get:
      summary: Export results as FHIR bundle
      operationId: getFhirBundle
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: FHIR R4 Bundle representation of the case and evidence
          content:
            application/json:
              schema:
                type: object
                description: Synthetic FHIR Bundle

  # ───────────── Claims module (version-3.0) ─────────────
  # Claimant = role patient. Insurer = roles payer_reviewer, payer_admin in an
  # Organization with kind "payer". Insurers read a case only through an active
  # CaseShareGrant created by the claimant. All claim decisions are human.

  /claims/payers:
    get:
      summary: List active insurer organizations a claimant can submit to
      operationId: listClaimPayers
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      responses:
        '200':
          description: Insurers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                  required: [ id, name ]

  /claims/eligible-cases:
    get:
      summary: List the claimant's pharmacist-VERIFIED cases (only these can be claimed)
      operationId: listClaimEligibleCases
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      responses:
        '200':
          description: Eligible cases
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    caseReference: { type: string }
                    subjectReference: { type: [ string, 'null' ] }
                    status: { const: VERIFIED }
                    updatedAt: { type: string, format: date-time }
                    invoiceTotal:
                      type: [ number, 'null' ]
                      description: Verified pharmacy bill total in INR from the case's invoice fields; null when unknown. A claim may not exceed it.
                    approvedSoFar: { type: number, description: Amount insurers already approved or settled on this bill. }
                    remainingAmount:
                      type: [ number, 'null' ]
                      description: invoiceTotal minus approvedSoFar (never below 0); null when the bill total is unknown. The most a new claim may ask for.
                    claimable: { type: boolean, description: False while another claim on the case is open or when the bill is fully approved. }
                    blockedReason: { type: [ string, 'null' ] }
                    blockedCode: { type: [ string, 'null' ], enum: [ CASE_HAS_OPEN_CLAIM, CASE_FULLY_CLAIMED, null ] }
                  required: [ id, caseReference, status ]

  /claims:
    get:
      summary: List the claimant's own claims
      operationId: listMyClaims
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      responses:
        '200':
          description: Claims, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
    post:
      summary: Submit a claim on a VERIFIED case with explicit data-sharing consent
      description: >-
        Creates a CaseShareGrant (all scopes, 90-day expiry) for the chosen insurer and a SUBMITTED claim.
        One pharmacy bill is never paid twice: only one open claim per case across all insurers (409 DUPLICATE_OPEN_CLAIM / CASE_HAS_OPEN_CLAIM),
        no new claim with an insurer that already decided one on this case (409 ALREADY_DECIDED_BY_PAYER), none once the bill is fully approved
        (409 CASE_FULLY_CLAIMED), and never more than the part of the bill not yet approved (400 CLAIM_EXCEEDS_INVOICE).
      operationId: submitClaim
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                caseId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
                payerOrganizationId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
                claimedAmount: { type: number, exclusiveMinimum: 0, maximum: 10000000, multipleOf: 0.01, description: "Must not exceed the case invoice total minus amounts other insurers already approved, when the total is known (400 CLAIM_EXCEEDS_INVOICE)." }
                policyNumber: { type: string, pattern: '^[A-Za-z0-9-]{4,64}$' }
                consent:
                  type: object
                  properties:
                    accepted: { const: true }
                  required: [ accepted ]
              required: [ caseId, payerOrganizationId, claimedAmount, policyNumber, consent ]
      responses:
        '201':
          description: Claim submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/ClaimsError'
        '404':
          $ref: '#/components/responses/ClaimsError'
        '409':
          $ref: '#/components/responses/ClaimsError'

  /claims/{claimId}:
    get:
      summary: Get one of the claimant's claims
      operationId: getMyClaim
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '404':
          $ref: '#/components/responses/ClaimsError'

  /claims/{claimId}/queries/{queryId}/answer:
    post:
      summary: Claimant answers an open insurer query (QUERY_RAISED -> UNDER_PAYER_REVIEW)
      operationId: answerClaimQuery
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: queryId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                answer: { type: string, minLength: 2, maxLength: 2000 }
              required: [ answer ]
      responses:
        '200':
          description: Updated claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/ClaimsError'
        '404':
          $ref: '#/components/responses/ClaimsError'
        '409':
          $ref: '#/components/responses/ClaimsError'

  /claims/{claimId}/withdraw:
    post:
      summary: Withdraw an open claim and revoke the insurer's case access
      operationId: withdrawClaim
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim withdrawn, CaseShareGrant revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '409':
          $ref: '#/components/responses/ClaimsError'

  /payer/claims:
    get:
      summary: Insurer claims queue (own organization only)
      operationId: listPayerClaims
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ SUBMITTED, UNDER_PAYER_REVIEW, QUERY_RAISED, APPROVED, PARTIALLY_APPROVED, REJECTED, SETTLED, WITHDRAWN, APPEALED ]
        - name: q
          in: query
          required: false
          description: Claim reference prefix
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: One page of queue items (totals in headers)
          headers:
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
            X-Page: { $ref: '#/components/headers/XPage' }
            X-Limit: { $ref: '#/components/headers/XLimit' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayerClaimSummary'

  /claims/{claimId}/appeal:
    post:
      summary: Claimant appeals a REJECTED or PARTIALLY_APPROVED decision (once)
      description: >-
        Requires an active consent grant and must be sent within 7 days of the decision (409 APPEAL_WINDOW_CLOSED) and before the claimant
        accepted it (409 DECISION_ACCEPTED). A different insurer reviewer must decide the appeal (403 FOUR_EYES_APPEAL otherwise).
      operationId: appealClaim
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 20, maxLength: 2000 }
              required: [ reason ]
      responses:
        '200':
          description: Claim in APPEALED status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          $ref: '#/components/responses/ClaimsError'
        '409':
          $ref: '#/components/responses/ClaimsError'

  /claims/{claimId}/accept-decision:
    post:
      summary: Claimant accepts a PARTIALLY_APPROVED decision
      description: >-
        Gives up the appeal so the insurer can settle the approved amount. Without acceptance a partial approval can be settled only after
        the 7-day appeal window ends or an appeal was used. The claim status stays PARTIALLY_APPROVED; decisionAcceptedAt is set and audited.
      operationId: acceptClaimDecision
      security:
        - bearerAuth: [ "patient" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim with decisionAcceptedAt set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '404':
          $ref: '#/components/responses/ClaimsError'
        '409':
          $ref: '#/components/responses/ClaimsError'

  /payer/analytics:
    get:
      summary: Claim counts by status, decision time and query rate for the insurer organization
      operationId: getPayerAnalytics
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      responses:
        '200':
          description: Aggregates from recorded claims only
          content:
            application/json:
              schema:
                type: object
                properties:
                  byStatus:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        count: { type: integer }
                        claimedAmount: { type: number }
                  decidedCount: { type: integer }
                  averageDecisionHours: { type: [ number, 'null' ] }
                  queryRate: { type: [ number, 'null' ] }
                  note: { type: string }
                required: [ byStatus, decidedCount, averageDecisionHours, queryRate ]

  /payer/claims/{claimId}:
    get:
      summary: Insurer claim workspace with consented case evidence
      description: Returns 403 CONSENT_INACTIVE when the grant expired or was revoked. Every view is audited. Storage keys are never returned.
      operationId: getPayerClaim
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim, consent, case summary, documents metadata, extracted fields, checks, signals, pharmacist decisions, reason codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: '#/components/schemas/Claim' }
                  consent:
                    type: object
                    properties:
                      grantedAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time }
                      scope: { type: array, items: { type: string } }
                  pharmacyName: { type: string }
                  case: { type: [ object, 'null' ] }
                  documents: { type: array, items: { type: object } }
                  extractedFields: { type: array, items: { type: object } }
                  consistencyChecks: { type: array, items: { type: object } }
                  riskSignals: { type: array, items: { type: object } }
                  reviewDecisions: { type: array, items: { type: object } }
                  amountCheck:
                    type: object
                    description: Claimed amount compared with the verified invoice total (a review prompt, not a decision).
                    properties:
                      invoiceTotal: { type: [ number, 'null' ] }
                      approvedElsewhere: { type: number, description: Amount other insurers already approved on the same bill (amount only). }
                      claimedAmount: { type: number }
                      status: { enum: [ WITHIN_INVOICE, EXCEEDS_INVOICE, UNKNOWN ] }
                  settleCheck:
                    type: object
                    description: Whether this user can mark the claim settled now, and why not.
                    properties:
                      allowed: { type: boolean }
                      reason: { type: [ string, 'null' ] }
                  youDecidedAppealedDecision:
                    type: boolean
                    description: True when this reviewer made the decision under appeal; a different reviewer must decide it.
                  reasonCodes:
                    type: object
                    properties:
                      rejected: { type: array, items: { type: string } }
                      partial: { type: array, items: { type: string } }
                required: [ claim, consent, documents, extractedFields, consistencyChecks, riskSignals, reviewDecisions, reasonCodes ]
        '403':
          $ref: '#/components/responses/ClaimsError'
        '404':
          $ref: '#/components/responses/ClaimsError'

  /payer/claims/{claimId}/documents/{documentId}/content:
    get:
      summary: Stream a consented case document to the insurer (audited, no-store)
      operationId: getPayerClaimDocument
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: documentId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      responses:
        '200':
          description: Original document bytes
          content:
            application/pdf: {}
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '403':
          $ref: '#/components/responses/ClaimsError'
        '404':
          $ref: '#/components/responses/ClaimsError'

  /payer/claims/{claimId}/fhir-bundle:
    get:
      summary: Draft FHIR R4 claim bundle (Claim, Coverage, ClaimResponse) with structural validation
      operationId: getPayerClaimFhirBundle
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Bundle, validation result and disclaimer (not certified NHCX conformance)
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundle: { type: object }
                  validation:
                    type: object
                    properties:
                      valid: { type: boolean }
                      issues:
                        type: array
                        items:
                          type: object
                          properties:
                            severity: { type: string, enum: [ error, warning ] }
                            path: { type: string }
                            message: { type: string }
                  disclaimer: { type: string }
                required: [ bundle, validation, disclaimer ]

  /payer/claims/{claimId}/start-review:
    post:
      summary: Insurer opens review (SUBMITTED or APPEALED -> UNDER_PAYER_REVIEW)
      operationId: startPayerReview
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Updated claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '409':
          $ref: '#/components/responses/ClaimsError'

  /payer/claims/{claimId}/queries:
    post:
      summary: Insurer asks the claimant a question (UNDER_PAYER_REVIEW -> QUERY_RAISED)
      operationId: raisePayerQuery
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                question: { type: string, minLength: 5, maxLength: 2000 }
              required: [ question ]
      responses:
        '200':
          description: Updated claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          $ref: '#/components/responses/ClaimsError'
        '409':
          $ref: '#/components/responses/ClaimsError'

  /payer/claims/{claimId}/decision:
    post:
      summary: Record a human claim decision
      description: APPROVED must equal the claimed amount; PARTIALLY_APPROVED needs a lower amount and a partial reason code; REJECTED needs a rejection reason code. A 10-2000 character note is always required. Only one decision per claim (409 on a second attempt).
      operationId: recordPayerDecision
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ APPROVED, PARTIALLY_APPROVED, REJECTED ] }
                approvedAmount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
                reasonCode:
                  type: string
                  enum: [ DOCUMENT_MISMATCH, MISSING_DOCUMENT, NOT_COVERED_UNDER_POLICY, DUPLICATE_CLAIM, POLICY_INACTIVE, ITEM_NOT_COVERED, QUANTITY_LIMIT, AMOUNT_ABOVE_LIMIT, OTHER ]
                note: { type: string, minLength: 10, maxLength: 2000 }
              required: [ decision, note ]
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          $ref: '#/components/responses/ClaimsError'
        '409':
          $ref: '#/components/responses/ClaimsError'

  /payer/claims/{claimId}/assistant/answers:
    post:
      summary: Evidence assistant for the insurer reviewer (consent-bound, cited, never decides)
      description: >-
        Answers a question about this claim's verification case using only the evidence the claimant shared through the active
        CaseShareGrant (403 CONSENT_INACTIVE otherwise). Uses the local TrustRAG case-assistant pipeline: no web search, no external LLM.
        Every evidence answer cites prescription / invoice fields. Requests to approve, reject, settle or judge fraud return mode SAFETY:
        humans decide. No freshness receipt is issued (bindingToken is null). Use is audited as PAYER_ASSISTANT_QUERY without storing the question.
      operationId: askPayerClaimAssistant
      security:
        - bearerAuth: [ "payer_reviewer", "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                medicineItemId: { type: [ string, 'null' ], pattern: '^mi_[a-f0-9]{24}$' }
              required: [ message ]
      responses:
        '200':
          description: Cited answer, a clarification with medicine choices, an abstention, or a SAFETY refusal
          content:
            application/json:
              schema:
                type: object
                properties:
                  audience: { const: PAYER }
                  claimReference: { type: string }
                  caseId: { type: string }
                  reply: { type: string }
                  mode: { enum: [ LOCAL_CASE_EVIDENCE, CLARIFY, ABSTAIN, SAFETY ] }
                  intent: { type: string }
                  medicineItemId: { type: [ string, 'null' ] }
                  choices: { type: array, items: { type: object } }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        citation: { type: string }
                        documentId: { type: [ string, 'null' ] }
                        fieldId: { type: [ string, 'null' ] }
                        pageNumber: { type: [ integer, 'null' ] }
                        title: { type: string }
                        excerpt: { type: string }
                  warnings: { type: array, items: { type: string } }
                  bindingToken: { const: null }
                  suggestedQuestions: { type: array, items: { type: string } }
                  disclaimer: { type: string }
                required: [ audience, reply, mode, sources, disclaimer ]
        '400':
          $ref: '#/components/responses/ClaimsError'
        '403':
          $ref: '#/components/responses/ClaimsError'
        '404':
          $ref: '#/components/responses/ClaimsError'
        '429':
          $ref: '#/components/responses/ClaimsError'

  /payer/claims/{claimId}/settle:
    post:
      summary: Mark an approved claim settled (simulated, no payment moves)
      description: >-
        Records the approved amount as settlement.amount. A PARTIALLY_APPROVED claim can be settled only after the claimant accepted it,
        used the appeal, or the 7-day appeal window ended (409 APPEAL_WINDOW_OPEN otherwise).
      operationId: settlePayerClaim
      security:
        - bearerAuth: [ "payer_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Settled claim with simulated settlement reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '409':
          $ref: '#/components/responses/ClaimsError'

  /pharmacy/claims:
    get:
      summary: Read-only status of claims built on this pharmacy organization's cases
      operationId: listPharmacyLinkedClaims
      security:
        - bearerAuth: [ "pharmacy", "pharmacist", "claims_reviewer", "org_admin", "branch_manager" ]
        - cookieAuth: []
      responses:
        '200':
          description: Claim status rows (no amounts, no insurer notes)

  /notifications:
    get:
      summary: Latest 50 notifications for the signed-in user
      operationId: listNotifications
      responses:
        '200':
          description: Unread count and items
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer, minimum: 0 }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                required: [ unread, items ]

  /notifications/read-all:
    post:
      summary: Mark all notifications read
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: Done

  /notifications/{notificationId}/read:
    post:
      summary: Mark one notification read
      operationId: markNotificationRead
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      responses:
        '200':
          description: Done

  /users/mfa/setup:
    servers:
      - url: /api
    post:
      summary: Start TOTP MFA enrolment; returns the base32 secret and otpauth URI once
      description: The secret is stored AES-256-GCM encrypted as pending. Requires MFA_ENCRYPTION_KEY on the server (503 otherwise).
      operationId: setupMfa
      responses:
        '200':
          description: Enrolment secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, pattern: '^[A-Z2-7]+$' }
                  otpauthUri: { type: string }
                required: [ secret, otpauthUri ]
        '409':
          description: MFA already enabled

  /users/mfa/enable:
    servers:
      - url: /api
    post:
      summary: Confirm enrolment with a valid 6-digit code; revokes other sessions
      operationId: enableMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
              required: [ code ]
      responses:
        '200':
          description: MFA enabled; a fresh session is issued. The one-time recovery codes are returned only in this response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaEnabled: { type: boolean }
                  recoveryCodes: { $ref: '#/components/schemas/RecoveryCodes' }
        '400':
          description: Code did not match or setup not started

  /users/mfa/disable:
    servers:
      - url: /api
    post:
      summary: Turn MFA off with a current code
      operationId: disableMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
              required: [ code ]
      responses:
        '200':
          description: MFA disabled
        '400':
          description: Code did not match or MFA not enabled
        '403':
          description: MFA is mandatory for this role (MFA_REQUIRED_FOR_STAFF)

  /users/mfa/recovery-codes:
    servers:
      - url: /api
    post:
      summary: Replace the one-time recovery codes (needs a current authenticator code)
      operationId: regenerateMfaRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
              required: [ code ]
      responses:
        '200':
          description: New codes; the previous set stops working
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes: { $ref: '#/components/schemas/RecoveryCodes' }
                required: [ recoveryCodes ]
        '400':
          description: Code did not match or MFA not enabled

  /users/organization/review-policy:
    servers:
      - url: /api
    post:
      summary: Pharmacy org admin allows or forbids single-pharmacist verification (audited)
      operationId: updateReviewPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { allowSingleReviewerVerify: { type: boolean } }, required: [ allowSingleReviewerVerify ] }
      responses:
        '200':
          description: Updated policy
        '403':
          description: Not a pharmacy organization admin

  /users/me/text-alerts:
    servers:
      - url: /api
    post:
      summary: Opt in or out of SMS / WhatsApp alerts (texts never contain case content)
      description: Turning off removes the stored number. Delivery needs NOTIFY_TEXT_ENABLED and a configured gateway. Audited.
      operationId: updateTextAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                phone: { type: string, maxLength: 20 }
                channel: { type: string, enum: [ sms, whatsapp ] }
              required: [ enabled ]
      responses:
        '200':
          description: Saved (phone returned masked)
        '400':
          description: INVALID_PHONE

  # ───────────── Audit log integrity (read-only; no edit/delete routes exist) ─────────────

  /audit/chain/verify:
    get:
      summary: Recompute the tamper-evident audit hash chain and report the first break
      description: super_admin or auditor only. Each event stores chainSeq, prevHash and hash (SHA-256, or HMAC-SHA-256 with AUDIT_CHAIN_KEY). The check itself is audited.
      operationId: verifyAuditChain
      parameters:
        - name: fromSeq
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditChainVerification' }
        '400':
          description: Invalid fromSeq
        '403':
          description: Caller is not super_admin or auditor

  # ───────────── Data-principal rights (export, erasure) ─────────────

  /me/data-export:
    get:
      summary: Download the signed-in person's own data as JSON
      description: Excludes storage keys, password hashes, MFA secrets and staff identities. Audited.
      operationId: exportMyData
      responses:
        '200':
          description: Personal data export (format pharmavault-personal-data-export/v1); with ?format=html a readable, printable summary
          content:
            application/json:
              schema: { type: object, properties: { format: { type: string, const: pharmavault-personal-data-export/v1 } }, required: [ format ] }

  /me/data-requests:
    get:
      summary: The signed-in person's export and erasure requests
      operationId: listMyDataRequests
      responses:
        '200':
          description: Requests, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DataRequest' } }

  /me/erasure-request:
    post:
      summary: Ask for erasure (patients). Completed by a platform administrator within 30 days.
      operationId: requestErasure
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 1000 } } }
      responses:
        '201':
          description: Request recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRequest' }
        '403':
          description: ERASURE_PATIENT_ONLY
        '409':
          description: ERASURE_ALREADY_REQUESTED

  /me/data-requests/{id}/cancel:
    post:
      summary: Cancel an open erasure request
      operationId: cancelMyDataRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{24}$' }
      responses:
        '200':
          description: Cancelled
        '404':
          description: No open request with that id

  /privacy/data-requests:
    get:
      summary: Erasure request queue (super_admin)
      operationId: listErasureRequests
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ OPEN, COMPLETED, BLOCKED, CANCELLED ], default: OPEN }
      responses:
        '200':
          description: Requests, oldest first
        '403':
          description: Not super_admin

  /privacy/data-requests/{id}/complete:
    post:
      summary: Perform an erasure (super_admin)
      description: Refused while the person has an open claim. Purges document content of their cases, revokes consent grants, deletes notifications, anonymises and deactivates the account. Claims, review decisions and audit events are kept.
      operationId: completeErasure
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { note: { type: string, minLength: 10, maxLength: 2000 } }, required: [ note ] }
      responses:
        '200':
          description: Completed with outcome counts
        '400':
          description: NOTE_REQUIRED
        '403':
          description: Not super_admin
        '404':
          description: DATA_REQUEST_NOT_FOUND
        '409':
          description: ERASURE_BLOCKED_OPEN_CLAIMS or DATA_REQUEST_CLOSED

  # ───────────── Team & Access (staff administration) ─────────────

  /users/staff/{userId}/deactivate:
    servers:
      - url: /api
    post:
      summary: Deactivate a staff account and revoke all its sessions
      description: Organization admins (org_admin, payer_admin) act only on staff of their own organization; super_admin on any staff. Patients are never reachable. Audited.
      operationId: deactivateStaff
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      responses:
        '200':
          description: Updated staff summary
        '400':
          description: Invalid input or action on own account
        '403':
          description: Caller is not an organization administrator
        '404':
          description: Staff member not found in the caller's organization

  /users/staff/{userId}/reactivate:
    servers:
      - url: /api
    post:
      summary: Reactivate a staff account (also clears any lockout)
      description: Organization admins (org_admin, payer_admin) act only on staff of their own organization; super_admin on any staff. Patients are never reachable. Audited.
      operationId: reactivateStaff
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      responses:
        '200':
          description: Updated staff summary
        '400':
          description: Invalid input or action on own account
        '403':
          description: Caller is not an organization administrator
        '404':
          description: Staff member not found in the caller's organization

  /users/staff/{userId}/role:
    servers:
      - url: /api
    post:
      summary: Change a staff role within the organization type; revokes sessions
      description: Organization admins (org_admin, payer_admin) act only on staff of their own organization; super_admin on any staff. Patients are never reachable. Audited.
      operationId: changeStaffRole
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, enum: [ pharmacist, pharmacy, claims_reviewer, org_admin, branch_manager, payer_reviewer, payer_admin ] }
              required: [ role ]
      responses:
        '200':
          description: Updated staff summary
        '400':
          description: Invalid input or action on own account
        '403':
          description: Caller is not an organization administrator
        '404':
          description: Staff member not found in the caller's organization

  /users/staff/{userId}/sign-out:
    servers:
      - url: /api
    post:
      summary: Sign a staff member out of every session (bumps sessionVersion)
      description: Organization admins (org_admin, payer_admin) act only on staff of their own organization; super_admin on any staff. Patients are never reachable. Audited.
      operationId: forceSignOutStaff
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      responses:
        '200':
          description: Updated staff summary
        '400':
          description: Invalid input or action on own account
        '403':
          description: Caller is not an organization administrator
        '404':
          description: Staff member not found in the caller's organization

  /users/staff/{userId}/unlock:
    servers:
      - url: /api
    post:
      summary: Clear a sign-in lockout
      description: Organization admins (org_admin, payer_admin) act only on staff of their own organization; super_admin on any staff. Patients are never reachable. Audited.
      operationId: unlockStaff
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      responses:
        '200':
          description: Updated staff summary
        '400':
          description: Invalid input or action on own account
        '403':
          description: Caller is not an organization administrator
        '404':
          description: Staff member not found in the caller's organization

  /users/staff/{userId}/credential:
    servers:
      - url: /api
    post:
      summary: Record an admin-confirmed professional registration (needed for VERIFY when REVIEW_CREDENTIAL_REQUIRED=true)
      description: Organization admins (org_admin, payer_admin) act only on staff of their own organization; super_admin on any staff. Patients are never reachable. Audited.
      operationId: confirmStaffCredential
      parameters:
        - $ref: '#/components/parameters/StaffUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                registrationNumber: { type: string, pattern: '^[A-Za-z0-9/-]{3,40}$' }
                council: { type: string, minLength: 3, maxLength: 120 }
                checkedVia: { type: string, minLength: 5, maxLength: 200, description: How the admin checked the registration }
                validUntil: { type: string, format: date, description: Renewal date; after it VERIFY is blocked until re-confirmed }
              required: [ registrationNumber, council, checkedVia ]
      responses:
        '200':
          description: Updated staff summary
        '400':
          description: Invalid input or action on own account
        '403':
          description: Caller is not an organization administrator
        '404':
          description: Staff member not found in the caller's organization

  # ───────────── Reviewer workflow (assignment lease, reopen) ─────────────

  /review/cases/{caseId}/assignment:
    get:
      summary: Who holds the case right now
      operationId: getReviewAssignment
      security:
        - bearerAuth: [ "pharmacist", "pharmacy", "claims_reviewer", "org_admin", "super_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Current assignment (null when free)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewAssignment' }
        '404':
          description: Case not found in your organization
    post:
      summary: Take (or renew) the case for a time-limited lease (REVIEW_ASSIGNMENT_MINUTES, default 30)
      description: Fails with 409 CASE_ASSIGNED_TO_OTHER while another reviewer's lease is active. Org admins may pass force=true to reassign. Recording a decision ends the lease.
      operationId: takeReviewAssignment
      security:
        - bearerAuth: [ "pharmacist", "pharmacy", "claims_reviewer", "org_admin", "super_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force: { type: boolean }
      responses:
        '200':
          description: Assignment held by the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewAssignment' }
        '403':
          description: Not a reviewer, or force without admin role
        '409':
          description: CASE_ASSIGNED_TO_OTHER or CASE_NOT_REVIEWABLE
    delete:
      summary: Release the case (holder, or an org admin)
      operationId: releaseReviewAssignment
      security:
        - bearerAuth: [ "pharmacist", "pharmacy", "claims_reviewer", "org_admin", "super_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewAssignment' }
        '409':
          description: NOT_ASSIGNED_TO_YOU

  /review/cases/{caseId}/reopen:
    post:
      summary: Reopen a VERIFIED or REJECTED case for a new review (org admin, audited)
      description: Moves the case to NEEDS_REVIEW and bumps the evidence revision so every earlier snapshotToken is stale. Refused while an insurance claim on the case is open.
      operationId: reopenCase
      security:
        - bearerAuth: [ "org_admin", "super_admin" ]
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
              required: [ reason ]
      responses:
        '200':
          description: Case reopened
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId: { type: string }
                  status: { const: NEEDS_REVIEW }
                  previousStatus: { type: string, enum: [ VERIFIED, REJECTED ] }
                  reopenCount: { type: integer, minimum: 1 }
                  evidenceRevision: { type: integer, minimum: 1 }
                required: [ caseId, status, previousStatus, reopenCount, evidenceRevision ]
        '400':
          description: REOPEN_REASON_REQUIRED
        '403':
          description: FORBIDDEN_ROLE
        '409':
          description: CASE_NOT_REOPENABLE or CLAIM_IN_PROGRESS
