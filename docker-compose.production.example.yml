# Single-node academic deployment example. Do not place real secrets in this file.
# Use a managed secret store or an ignored backend/.env.production file instead.
services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 5001
      DOCUMENT_STORAGE_ROOT: /var/lib/pharmavault/documents
      TRUSTRAG_TESSDATA_PATH: /opt/tessdata
      TRUSTRAG_LLM_ENABLED: "false"
      TRUSTRAG_LLM_EXPORT_ALLOWED: "false"
      # Keep paid/public generation off until separately configured and evaluated.
      RAG_CHAT_LLM_ENABLED: "false"
      RAG_CHAT_PUBLIC_EXPORT_ALLOWED: "false"
      RAG_CHAT_EMBEDDINGS_ENABLED: "false"
      RAG_CHAT_WEB_ENABLED: "false"
      RAG_CHAT_WEB_SYNTHESIS_ALLOWED: "false"
      TRUST_PROXY: 1
    ports:
      # Keep the API private; terminate TLS at a managed gateway/reverse proxy.
      - "127.0.0.1:5001:5001"
    volumes:
      - pharmavault_documents:/var/lib/pharmavault/documents
      # Provision locally and mount read-only. It is intentionally not in the image.
      - ./backend/tessdata:/opt/tessdata:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=128m

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    # Terminate HTTPS at an authorized gateway. Never expose this HTTP port
    # directly to the internet; cookies require HTTPS in production.
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m,mode=1777

volumes:
  pharmavault_documents:
