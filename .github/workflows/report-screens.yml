name: Report screenshots (one-off)
on:
  push:
    branches: ['report/screenshots']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/pharmavault_e2e
      JWT_SECRET: ci-only-e2e-jwt-secret-not-for-production-0001
      GEMINI_API_KEY: ci-only-not-used
      MFA_ENCRYPTION_KEY: ci-only-mfa-key-0123456789abcdef0123
      E2E_SETUP_ENABLED: 'true'
      E2E_SETUP_KEY: ci-only-e2e-setup-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '22' }
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm install --prefix e2e --no-audit --no-fund
          npx --prefix e2e playwright install --with-deps chromium
      - run: npm --prefix backend run seed:all
      - working-directory: e2e
        run: npx playwright test tests/report-screens.spec.ts --reporter=line || true
      - name: Commit screenshots to report-screenshots-out
        run: |
          mkdir /tmp/out && cp -r e2e/report/* /tmp/out/ || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan report-screenshots-out
          git rm -rf -q . && git clean -fdxq -e node_modules || true
          cp /tmp/out/* . && git add *.png && git commit -qm "report screenshots (synthetic data)" && git push -f origin report-screenshots-out
