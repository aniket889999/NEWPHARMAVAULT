name: Playwright end-to-end

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'version-**']
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *' # nightly 02:47 IST on main: catches drift from dependencies and time

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/pharmavault_e2e
      JWT_SECRET: ci-only-e2e-jwt-secret-not-for-production-0001
      GEMINI_API_KEY: ci-only-not-used
      MFA_ENCRYPTION_KEY: ci-only-mfa-key-0123456789abcdef0123
      E2E_SETUP_ENABLED: 'true'
      E2E_SETUP_KEY: ci-only-e2e-setup-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install app and e2e dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm install --prefix e2e --no-audit --no-fund
          npx --prefix e2e playwright install --with-deps chromium
      - name: Seed synthetic demo accounts
        run: |
          npm --prefix backend run seed:demo
          npm --prefix backend run seed:showcase
      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Upload showcase screenshots (synthetic claimant ↔ fictional insurer)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showcase-screenshots
          path: e2e/showcase/
          if-no-files-found: ignore
          retention-days: 30
