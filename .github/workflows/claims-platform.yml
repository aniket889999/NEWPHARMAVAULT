name: Claims module and platform checks

on:
  push:
    branches: [main, 'version-**', 'feat/**', 'feature/**']
  pull_request:
    branches: [main, 'version-**']

permissions:
  contents: read

concurrency:
  group: claims-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Claims state machine, TOTP, FHIR validator, locks and shared rate limits (no database)
        run: node --test backend/tests/claimsPlatformPure.test.js backend/tests/platformLocksPure.test.js backend/tests/claimsContractParity.test.js backend/tests/storageEncryptionRetentionPure.test.js backend/tests/reviewPolicyPure.test.js backend/tests/accountSecurityPure.test.js backend/tests/auditChainPure.test.js backend/tests/opsPure.test.js backend/tests/textMessagingPure.test.js backend/tests/reminderSchedulerPure.test.js backend/tests/testDatabaseGuard.test.js
      - name: Claims HTTP workflow, consent, tenant isolation and MFA login (real MongoDB)
        run: NODE_ENV='test' node --test --test-concurrency=1 backend/tests/claimsWorkflowIntegration.test.js backend/tests/reviewWorkflowIntegration.test.js backend/tests/accountSecurityIntegration.test.js backend/tests/auditChainIntegration.test.js backend/tests/dataRightsIntegration.test.js
      - name: Real chain with local OCR (claimant upload → OCR → pharmacist → claim → insurer + evidence assistant)
        env:
          CLAIMS_REAL_OCR: 'true'
          CLAIMS_TESSDATA_PATH: ${{ runner.temp }}/tessdata
        run: |
          # Language data is provisioned for CI only (pinned commit + checksum); the app itself never downloads it.
          mkdir -p "$CLAIMS_TESSDATA_PATH"
          curl -fsSL -o "$CLAIMS_TESSDATA_PATH/eng.traineddata" https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata
          echo "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  $CLAIMS_TESSDATA_PATH/eng.traineddata" | sha256sum -c -
          NODE_ENV='test' node --test --test-concurrency=1 backend/tests/claimsRealOcrChain.test.js
      - name: OpenAPI and JSON Schema validation
        run: |
          npm run validate:contract
          npm run validate:schemas
      - name: Strict frontend build (portals, claims and insurer pages)
        run: npm run build:frontend
      - name: Dependency vulnerability scan (production dependencies, fail on critical)
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit --prefix backend --omit=dev --audit-level=critical
      - name: Health Assistant demo evaluation (report only)
        run: node tests/chat-eval/run.cjs --json chat-eval-results.json || true
